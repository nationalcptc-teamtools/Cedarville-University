[package]
name = "port-herald"
version = "0.1.0"
edition = "2021"
description = "Port Herald - Network reconnaissance & team collaboration platform"

[dependencies]
actix-web = "4.4"
actix-files = "0.6"
actix-cors = "0.7"
rust-embed = "8"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
quick-xml = { version = "0.31", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }
ipnetwork = "0.20"
ipnet = "2.9"
cidr = "0.2"
uuid = { version = "1.6", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
regex = "1.10"
once_cell = "1.19"
clap = { version = "4.4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
